<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xiajun Liu.design</title>
  <style>
    :root {
      --bg: #060608;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #ababab;
      --text-muted: #7e7e97;
      --nav-active-bg: #ffffff;
      --nav-active-text: #060608;
      --nav-inactive-text: #a1a1aa;
      --page-padding: clamp(24px, 5vw, 48px);
      --section-gap: clamp(80px, 12vw, 120px);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      z-index: -1;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Navigation ── */
    .nav-wrapper {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--nav-inactive-text);
      transition: background 0.25s, color 0.25s;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-text);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.12);
      color: var(--nav-inactive-text);
      transition: background 0.25s, color 0.25s;
    }

    .nav-item.active .nav-badge {
      background: rgba(0, 0, 0, 0.08);
      color: var(--nav-active-text);
    }

    /* ── Layout ── */
    .page {
      background-color: var(--bg);
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--page-padding) 80px;
    }

    #home {
      background-color: var(--bg);
    }

    #sections-container {
      padding-top: 24px;
      background-color: var(--bg);
    }

    .page > section:first-child {
      max-width: none;
      width: 100%;
      margin-left: 0;
      margin-bottom: var(--section-gap);
    }

    section {
      margin-bottom: var(--section-gap);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Hero ── */
    .hero-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px var(--page-padding) 80px;
      overflow: hidden;
      background-color: var(--bg);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      isolation: isolate;
    }

    .hero-photo-fx {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .hero-visual-bg {
      position: absolute;
      inset: -35% -28% 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .hero-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: orbFloat 12s ease-in-out infinite;
    }

    .hero-orb-1 {
      width: 320px;
      height: 320px;
      top: -6%;
      right: 0;
      background: radial-gradient(circle, rgba(232, 34, 42, 0.28) 0%, transparent 70%);
    }

    .hero-orb-2 {
      width: 280px;
      height: 280px;
      bottom: 8%;
      left: -8%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.18) 0%, transparent 70%);
      animation-delay: -4s;
    }

    .hero-orb-3 {
      width: 220px;
      height: 220px;
      top: 36%;
      left: 28%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      animation-delay: -7s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(24px, -18px) scale(1.06); }
    }

    .hero-light-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .hero-light-veil {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 60% at 50% 18%, rgba(255, 255, 255, 0.08) 0%, transparent 62%);
    }

    .hero-light-glow {
      position: absolute;
      width: 360px;
      height: 360px;
      top: -4%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      filter: blur(90px);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 42%, transparent 72%);
      animation: heroLightDrift 14s ease-in-out infinite;
    }

    @keyframes heroLightDrift {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.78; }
      50% { transform: translateX(calc(-50% - 10px)) scale(1.05); opacity: 1; }
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: clamp(32px, 5vw, 72px);
      align-items: center;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 48px;
      }
      .hero-visual { order: -1; }
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .hero-greeting {
      font-size: clamp(14px, 1.8vw, 16px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(16px);
      animation: heroFadeUp 0.8s ease forwards;
    }

    .hero-headline {
      font-size: clamp(36px, 5.8vw, 72px);
      font-weight: 500;
      line-height: 1.08;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 28px;
      max-width: 640px;
    }

    .hero-headline .line {
      display: block;
      overflow: hidden;
    }

    .hero-headline .line-inner {
      display: block;
      opacity: 0;
      transform: translateY(110%);
      animation: lineReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hero-headline .line:nth-child(1) .line-inner { animation-delay: 0.15s; }
    .hero-headline .line:nth-child(2) .line-inner { animation-delay: 0.28s; }
    .hero-headline .line:nth-child(3) .line-inner { animation-delay: 0.41s; }

    .hero-headline .highlight {
      color: rgba(255, 255, 255, 1);
      background: linear-gradient(120deg, #fff 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    @keyframes lineReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heroFadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    #hero-subtitles {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero-subtitle {
      font-size: clamp(14px, 1.6vw, 17px);
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 0;
      opacity: 0;
      transform: translateY(12px);
      animation: heroFadeUp 0.7s ease forwards;
    }

    .hero-subtitle:nth-child(1) { animation-delay: 0.55s; }
    .hero-subtitle:nth-child(2) { animation-delay: 0.68s; color: rgba(255, 255, 255, 0.45); font-size: clamp(13px, 1.4vw, 15px); }

    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 36px;
      flex-wrap: wrap;
      opacity: 0;
      animation: heroFadeUp 0.7s ease 0.82s forwards;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      font-size: 13px;
      color: #060608;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
      box-shadow: 0 0 0 rgba(255,255,255,0);
    }

    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(255, 255, 255, 0.12);
    }

    .hero-cta::after { content: "→"; transition: transform 0.25s; }
    .hero-cta:hover::after { transform: translateX(4px); }

    .hero-scroll-hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-scroll-hint span {
      display: block;
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
      animation: scrollPulse 2s ease infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
      50% { opacity: 1; transform: scaleY(1); }
    }

    /* ── Hero Photo ── */
    .hero-photo-frame {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateY(40px) rotateY(-8deg);
      animation: photoEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      will-change: transform;
    }

    @keyframes photoEnter {
      to {
        opacity: 1;
        transform: translateY(0) rotateY(-4deg);
      }
    }

    .hero-photo-glow {
      position: absolute;
      inset: -20% -20% 0;
      background: radial-gradient(ellipse at 50% 20%, rgba(245, 166, 35, 0.35) 0%, rgba(232, 34, 42, 0.15) 40%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
      animation: glowPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    .hero-photo-white-light {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 28px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 85% 50% at 50% 0%, rgba(255, 255, 255, 0.18) 0%, transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 38%);
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .hero-photo-ring {
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      padding: 1px;
      background: linear-gradient(145deg, rgba(255,255,255,0.35), rgba(232,34,42,0.5), rgba(255,255,255,0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 2;
      pointer-events: none;
    }

    .hero-photo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 28px;
      display: block;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .hero-photo-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 28px;
      background: linear-gradient(
        180deg,
        rgba(6, 6, 8, 0) 55%,
        rgba(6, 6, 8, 0.55) 100%
      );
      pointer-events: none;
    }

    .hero-photo-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      opacity: 0;
      animation: heroFadeUp 0.6s ease 1s forwards;
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
      animation: dotPulse 2s ease infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hero-float-tag {
      position: absolute;
      z-index: 4;
      padding: 10px 16px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(6, 6, 8, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      opacity: 0;
      animation: heroFadeUp 0.6s ease 1.1s forwards;
    }

    .hero-float-tag-1 {
      top: -12px;
      right: -16px;
      animation-delay: 1.15s;
    }

    .hero-float-tag-2 {
      bottom: 72px;
      right: -24px;
      animation-delay: 1.25s;
    }

    /* ── About Cards ── */
    .about-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 0;
      padding: 48px var(--page-padding) 0;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      scroll-margin-top: 100px;
    }

    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; }
    }

    .about-card {
      padding: 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.35s,
        background 0.35s;
      transition-delay: calc(var(--i, 0) * 0.08s);
    }

    #home.visible .about-card {
      opacity: 1;
      transform: translateY(0);
    }

    .about-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
    }

    .about-card-icon {
      width: 20px;
      height: 20px;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .about-card-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .about-card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .about-card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .about-card-extra {
      margin-top: 24px;
    }

    /* ── Section Layout ── */
    .content-section {
      scroll-margin-top: 100px;
    }

    #life .section-main {
      padding-top: 72px;
      margin-top: 48px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-intro-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 20px;
      text-align: left;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .section-intro-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #life .section-title {
      text-align: left;
      margin-bottom: 16px;
    }

    #life .section-intro-title {
      margin-bottom: 32px;
    }

    .section-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .section-index {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }

    .section-main {
      width: 100%;
      min-width: 0;
    }

    .section-title {
      font-size: clamp(24px, 3.5vw, 36px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 36px;
      color: rgba(255, 255, 255, 0.95);
    }

    .section-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      max-width: 640px;
      margin: -20px 0 32px;
      line-height: 1.7;
    }

    /* ── Timeline (Work) ── */
    .timeline-list {
      display: flex;
      flex-direction: column;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: minmax(160px, 240px) minmax(0, 1fr);
      gap: 12px 48px;
      padding: 36px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      align-items: start;
    }

    .timeline-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .timeline-company {
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }

    .timeline-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      max-width: none;
      line-height: 1.75;
    }

    .work-projects-block {
      margin-top: 96px;
      padding-top: 72px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .work-projects-heading {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 48px;
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-projects-heading.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .work-projects {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: min(840px, 92%);
      margin: 0 auto;
    }

    .work-project-card {
      position: relative;
      display: block;
      width: 100%;
      min-height: 0;
      aspect-ratio: 16 / 10;
      border-radius: 24px;
      overflow: hidden;
      border: none;
      background: rgba(255, 255, 255, 0.03);
      opacity: 0;
      transform: translateY(32px);
      transition:
        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.3s;
      transition-delay: calc(var(--i, 0) * 0.08s);
      isolation: isolate;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .work-project-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .work-project-card.visible:hover {
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
      transform: translateY(-3px);
    }

    .work-project-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-project-card:hover img {
      transform: scale(1.03);
    }

    .work-project-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 6, 8, 0) 55%, rgba(6, 6, 8, 0.72) 100%);
      pointer-events: none;
    }

    .work-project-card[data-no-title] .work-project-overlay {
      background: transparent;
    }

    .work-project-title-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 28px 32px;
      pointer-events: none;
    }

    .work-project-title {
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.98);
      line-height: 1.25;
    }

    .work-project-card[data-align="center"] .work-project-title-wrap {
      text-align: center;
    }

    @media (max-width: 768px) {
      .timeline-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .work-project-card {
        border-radius: 20px;
        aspect-ratio: 4 / 3;
      }

      .work-project-title-wrap {
        padding: 20px 24px;
      }
    }

    /* ── Work Project Modal ── */

  <script>
    let data;

    function applyTokens(tokens, meta) {
      const root = document.documentElement;
      const c = tokens.colors;
      root.style.setProperty('--bg', c.background);
      root.style.setProperty('--surface', c.surface);
      root.style.setProperty('--surface-hover', c.surfaceHover);
      root.style.setProperty('--border', c.border);
      root.style.setProperty('--text-primary', c.textPrimary);
      root.style.setProperty('--text-secondary', c.textSecondary);
      root.style.setProperty('--text-muted', c.textMuted);
      if (meta?.title) document.title = meta.title;
    }

    async function loadData() {
      const inline = document.getElementById('portfolio-data');
      if (inline?.textContent.trim()) {
        return JSON.parse(inline.textContent);
      }
      const res = await fetch('./portfolio-content.json');
      if (!res.ok) throw new Error('无法加载 portfolio-content.json');
      return res.json();
    }

    function renderAll() {
      applyTokens(data.designTokens, data.meta);
      renderNav(data.navigation);
      renderHero(data.hero);
      renderAboutCards(data.aboutCards);
      renderSections(data.sections);
      renderFooter(data.footer);
      setupInteractions(data);
      setupLifeGallery();
      setupWorkProjectModal();
      document.getElementById('home')?.classList.add('visible');
    }

    function setupWorkProjectModal() {
      const modal = document.getElementById('work-modal');
      const closeBtn = document.getElementById('work-modal-close');
      const subtitle = document.getElementById('work-modal-subtitle');

      function openModal(title) {
        subtitle.textContent = title || '';
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.work-project-card').forEach(card => {
        card.addEventListener('click', () => {
          openModal(card.dataset.projectTitle || '');
        });
      });

      closeBtn?.addEventListener('click', closeModal);
      modal?.addEventListener('click', e => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal?.classList.contains('open')) closeModal();
      });
    }

    function setupLifeGallery() {
      const lightbox = document.getElementById('life-lightbox');
      const lbImg = document.getElementById('life-lightbox-img');
      const lbTitle = document.getElementById('life-lightbox-title');
      const lbCaption = document.getElementById('life-lightbox-caption');
      const lbClose = document.getElementById('life-lightbox-close');

      document.querySelectorAll('.life-photo').forEach(btn => {
        btn.addEventListener('click', () => {
          lbImg.src = btn.dataset.src;
          lbImg.alt = btn.dataset.alt;
          lbTitle.textContent = btn.dataset.title;
          lbCaption.textContent = btn.dataset.caption;
          lightbox.classList.add('open');
          lightbox.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        });
      });

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      lbClose?.addEventListener('click', closeLightbox);
      lightbox?.addEventListener('click', e => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && lightbox?.classList.contains('open')) closeLightbox();
      });

      document.querySelectorAll('.life-filters').forEach(group => {
        group.addEventListener('click', e => {
          const btn = e.target.closest('.life-filter');
          if (!btn) return;
          group.querySelectorAll('.life-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          const sections = group.nextElementSibling;
          sections?.querySelectorAll('.life-photo').forEach(photo => {
            const show = filter === 'all' || photo.dataset.tag === filter;
            photo.classList.toggle('is-hidden', !show);
          });
          sections?.querySelectorAll('.life-block').forEach(block => {
            const visible = block.querySelectorAll('.life-photo:not(.is-hidden)').length > 0;
            block.style.display = visible ? '' : 'none';
          });
        });
      });
    }

    async function init() {
      try {
        data = await loadData();
        renderAll();
      } catch (err) {
        console.error(err);
        document.body.insertAdjacentHTML('beforeend',
          '<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;padding:24px;text-align:center;">页面数据加载失败，请刷新重试。</p>'
        );
      }
    }

    /* ── Icon SVGs ── */
    const icons = {
      user: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
      code: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      spark: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>'
    };

    function renderNav(items) {
      const nav = document.getElementById('nav');
      nav.innerHTML = items.map(item => `
        <a class="nav-item${item.active ? ' active' : ''}" href="${item.href}" data-shortcut="${item.shortcut}">
          ${item.label}
          <span class="nav-badge">${item.shortcut}</span>
        </a>
      `).join('');
    }

    function renderHero(hero) {
      document.getElementById('hero-greeting').textContent = hero.greeting;

      const muted = hero.headline.muted;
      const highlight = hero.headline.highlight;
      const parts = muted.split(' and ');
      const lines = parts.length >= 2
        ? [parts[0] + ' and', parts.slice(1).join(' and ')]
        : [muted.replace(/\s+at\s*$/, '')];

      document.getElementById('hero-headline').innerHTML = [
        ...lines.map(l => `<span class="line"><span class="line-inner">${l}</span></span>`),
        `<span class="line"><span class="line-inner"><span class="highlight">${highlight}</span></span></span>`
      ].join('');

      document.getElementById('hero-subtitles').innerHTML = hero.subtitles
        .map(s => `<p class="hero-subtitle">${s}</p>`).join('');
      const cta = document.getElementById('hero-cta');
      cta.textContent = hero.cta.label;
      cta.href = hero.cta.href;

      const photo = document.getElementById('hero-photo');
      if (hero.image && photo) {
        photo.src = hero.image;
        photo.alt = hero.greeting.replace("Hello! I'm ", '');
      }
      const badgeText = document.getElementById('hero-badge-text');
      if (badgeText && hero.badge) badgeText.textContent = hero.badge;

      setupHeroParallax();
    }

    function setupHeroParallax() {
      const frame = document.getElementById('hero-photo-frame');
      if (!frame || window.matchMedia('(pointer: coarse)').matches) return;

      let raf = null;
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      document.addEventListener('mousemove', e => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        targetX = (e.clientX - cx) / cx * 8;
        targetY = (e.clientY - cy) / cy * 6;
        if (!raf) raf = requestAnimationFrame(tick);
      });

      function tick() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        frame.style.transform = `perspective(1200px) rotateY(${-4 + currentX * 0.4}deg) rotateX(${currentY * -0.3}deg) translateY(0)`;
        raf = Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01
          ? requestAnimationFrame(tick) : null;
      }
    }

    function renderAboutCards(cards) {
      document.getElementById('about').innerHTML = cards.map((card, i) => `
        <article class="about-card" id="about-${card.id}" style="--i:${i}">
          ${icons[card.icon] || ''}
          <h3 class="about-card-title">${card.title}</h3>
          <p class="about-card-subtitle">${card.subtitle}</p>
          <p class="about-card-desc">${card.description}</p>
          ${card.extra ? `
            <div class="about-card-extra">
              <p class="about-card-subtitle">${card.extra.subtitle}</p>
              <p class="about-card-desc">${card.extra.description}</p>
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    function renderWorkProjects(projects) {
      if (!projects?.length) return '';
      return `
        <div class="work-projects-block">
          <h3 class="work-projects-heading">Design Projects</h3>
          <div class="work-projects">
          ${projects.map((item, i) => {
            const align = item.titleAlign === 'center' ? ' data-align="center"' : '';
            const noTitle = item.showTitle === false ? ' data-no-title="true"' : '';
            return `
              <button type="button" class="work-project-card"${align}${noTitle} style="--i:${i}" data-project-title="${item.title}">
                <img src="${item.image}" alt="${item.title}" loading="lazy" />
                <div class="work-project-overlay"></div>
                ${item.showTitle !== false ? `
                <div class="work-project-title-wrap">
                  <h3 class="work-project-title">${item.title}</h3>
                </div>
                ` : ''}
              </button>
            `;
          }).join('')}
          </div>
        </div>
      `;
    }

    function renderSections(sections) {
      const container = document.getElementById('sections-container');
      container.innerHTML = sections.map(section => {
        let body = '';
        if (section.type === 'timeline' || section.type === 'work') {
          body = `
            <div class="timeline-list">
              ${section.items.map(item => `
                <div class="timeline-item">
                  <h4 class="timeline-company">${item.title.replace(/^\*/, '')}</h4>
                  <p class="timeline-desc">${item.description}</p>
                </div>
              `).join('')}
            </div>
          `;
          if (section.projects?.length) {
            body += renderWorkProjects(section.projects);
          }
        } else if (section.type === 'photo-gallery') {
          const tags = [...new Set(section.items.map(i => i.tag))];
          const filters = tags.map(t =>
            `<button class="life-filter" data-filter="${t}">${t}</button>`
          ).join('');

          const groups = [
            { key: 'sports', label: '运动' },
            { key: 'food', label: '美食' },
            { key: 'pets', label: '毛孩子们' }
          ];

          let photoIndex = 0;
          const renderPhoto = item => {
            const layout = item.layout || 'portrait';
            const focus = layout === 'tall' ? 'top' : 'center';
            const idx = photoIndex++;
            const gridStyle = item.placement
              ? `grid-column:${item.placement.column};grid-row:${item.placement.row};`
              : '';
            return `
              <button class="life-photo" type="button"
                data-layout="${layout}" data-tag="${item.tag}" data-category="${item.category}"
                style="--i:${idx};${gridStyle}"${focus !== 'center' ? ` data-focus="${focus}"` : ''}
                data-src="${item.src}" data-title="${item.title}" data-caption="${item.caption}" data-alt="${item.alt}">
                <img src="${item.src}" alt="${item.alt}" loading="lazy" />
                <div class="life-photo-overlay"></div>
                <span class="life-photo-tag">${item.tag}</span>
                <div class="life-photo-info">
                  <p class="life-photo-title">${item.title}</p>
                  <p class="life-photo-caption">${item.caption}</p>
                </div>
              </button>
            `;
          };

          const blocks = groups.map(g => {
            const items = section.items.filter(i => i.group === g.key);
            if (!items.length) return '';
            return `
              <div class="life-block" data-group="${g.key}">
                <div class="life-block-head">
                  <span class="life-block-label">${g.label}</span>
                </div>
                <div class="life-gallery" data-group="${g.key}">${items.map(renderPhoto).join('')}</div>
              </div>
            `;
          }).join('');

          body = `
            ${section.description ? `<p class="section-desc">${section.description}</p>` : ''}
            <div class="life-filters">
              <button class="life-filter active" data-filter="all">全部</button>
              ${filters}
            </div>
            <div class="life-sections">${blocks}</div>
          `;
        } else if (section.type === 'card-grid') {
          body = `
            ${section.description ? `<p class="section-desc">${section.description}</p>` : ''}
            <div class="card-grid">
              ${section.items.map((item, i) => `
                <a class="play-card" href="${item.href}" target="_blank" rel="noopener" style="--i:${i}">
                  <h4 class="play-card-title">${item.title}</h4>
                  <p class="play-card-desc">${item.description}</p>
                  <div class="play-card-tags">
                    ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                  </div>
                </a>
              `).join('')}
            </div>
            ${section.footnotes ? `
              <div class="footnotes">
                ${section.footnotes.map(f => `<p class="footnote">${f}</p>`).join('')}
              </div>
            ` : ''}
          `;
        } else if (section.type === 'article-list') {
          body = `
            ${section.description ? `<p class="section-desc">${section.description}</p>` : ''}
            <div class="article-list">
              ${section.items.map((item, i) => `
                <a class="article-item" href="${item.href}" target="_blank" rel="noopener" style="--i:${i}">
                  <div class="article-meta">
                    <h4 class="article-title">${item.title}</h4>
                    <span class="article-date">${item.date}</span>
                  </div>
                  <p class="article-subtitle">${item.subtitle}</p>
                  <p class="article-excerpt">${item.excerpt}</p>
                </a>
              `).join('')}
            </div>
          `;
        }
        return `
          <section id="${section.id}" class="content-section">
            <div class="section-grid">
              <span class="section-index">${section.index}</span>
              <div class="section-main">
                <h2 class="section-title">${section.title}</h2>
                ${section.introTitle ? `<h3 class="section-intro-title">${section.introTitle}</h3>` : ''}
                ${body}
              </div>
            </div>
          </section>
        `;
      }).join('');
    }

    function renderFooter(footer) {
      document.getElementById('footer').innerHTML = `
        <div class="footer-inner">
          <div class="footer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 12.5l2.5 2.5L16 9.5"/>
            </svg>
          </div>
          <blockquote class="footer-quote">"${footer.quote}"</blockquote>
          <div class="footer-meta">
            <p>${footer.builtWith}</p>
            <p>${footer.designedBy}</p>
            <p>${footer.copyright}</p>
          </div>
        </div>
      `;
    }

    /* ── Interactions ── */
    function setupInteractions(data) {
      // Scroll reveal
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: data.interactions.sectionReveal.threshold });

      document.querySelectorAll('section').forEach(s => observer.observe(s));

      const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

      document.querySelectorAll('.work-projects-heading, .work-project-card, .section-intro-title').forEach(el => {
        revealObserver.observe(el);
      });

      // Active nav on scroll
      const sectionIds = ['home', ...data.sections.map(s => s.id)];
      const navItems = document.querySelectorAll('.nav-item');

      function updateActiveNav() {
        let current = 'home';
        sectionIds.forEach(id => {
          const el = document.getElementById(id);
          if (el && el.getBoundingClientRect().top <= 200) current = id;
        });
        navItems.forEach(item => {
          const href = item.getAttribute('href').slice(1);
          item.classList.toggle('active', href === current);
        });
      }

      window.addEventListener('scroll', updateActiveNav, { passive: true });

      // Keyboard shortcuts
      if (data.interactions.keyboardShortcuts.enabled) {
        const hint = document.getElementById('keyboard-hint');
        let hintTimer;

        document.addEventListener('keydown', e => {
          const mapping = data.interactions.keyboardShortcuts.mapping;
          if (mapping[e.key]) {
            e.preventDefault();
            const target = document.querySelector(mapping[e.key]);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
            hint.classList.add('show');
            clearTimeout(hintTimer);
            hintTimer = setTimeout(() => hint.classList.remove('show'), 1500);
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
