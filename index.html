<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xiajun Liu.design</title>
  <link rel="icon" href="./assets/favicon.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="./assets/favicon.jpg" />
  <style>
    :root {
      --bg: #060608;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #ababab;
      --text-muted: #7e7e97;
      --nav-active-bg: #ffffff;
      --nav-active-text: #060608;
      --nav-inactive-text: #a1a1aa;
      --page-padding: clamp(24px, 5vw, 48px);
      --section-gap: clamp(80px, 12vw, 120px);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      z-index: -1;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Navigation ── */
    .nav-wrapper {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .nav-wrapper.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--nav-inactive-text);
      transition: background 0.25s, color 0.25s;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-text);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.12);
      color: var(--nav-inactive-text);
      transition: background 0.25s, color 0.25s;
    }

    .nav-item.active .nav-badge {
      background: rgba(0, 0, 0, 0.08);
      color: var(--nav-active-text);
    }

    /* ── Layout ── */
    .page {
      background-color: var(--bg);
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 var(--page-padding) 80px;
    }

    #home {
      background-color: var(--bg);
    }

    #sections-container {
      padding-top: clamp(80px, 11vw, 128px);
      background-color: var(--bg);
    }

    .page > section:first-child {
      max-width: none;
      width: 100%;
      margin-left: 0;
      margin-bottom: var(--section-gap);
    }

    section {
      margin-bottom: var(--section-gap);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Hero ── */
    .hero-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px var(--page-padding) 80px;
      overflow: hidden;
      background-color: var(--bg);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      isolation: isolate;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: clamp(32px, 5vw, 72px);
      align-items: center;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 48px;
      }
      .hero-visual { order: -1; }
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    /* ── Design System Auto-Assembly ── */
    .hero-asm-grid {
      position: absolute;
      inset: -32px -40px -24px -24px;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      border: 1px dashed rgba(96, 165, 250, 0.18);
      border-radius: 4px;
      opacity: 0;
    }

    .hero-asm-wrap {
      position: relative;
      z-index: 1;
    }

    .hero-asm-wrap--headline {
      margin-bottom: 28px;
    }

    .hero-asm-wrap--photo {
      position: relative;
      width: min(100%, 420px);
      margin: 0 auto;
    }

    .asm-dim-line {
      position: absolute;
      pointer-events: none;
      background: rgba(52, 211, 153, 0.6);
    }

    .asm-dim-line--h {
      height: 1px;
      transform-origin: 50% 50%;
    }

    .asm-dim-line--v {
      width: 1px;
      transform-origin: 50% 50%;
    }

    .asm-dim-line--ext-top {
      top: -34px;
      left: 18%;
      width: 64%;
    }

    .asm-dim-line--ext-right {
      right: -42px;
      top: 22%;
      height: 56%;
    }

    .asm-dim-line--ext-bottom {
      bottom: -30px;
      left: 10%;
      width: 45%;
    }

    [data-asm-photo] .asm-token-pill--tr {
      top: -26px;
      right: 0;
    }

    [data-asm-photo] .asm-token-pill--tl {
      top: -28px;
      left: -6px;
      right: auto;
    }

    [data-asm-photo] .asm-measure--bottom {
      bottom: -22px;
      right: 8px;
      left: auto;
    }

    .hero-asm-chrome {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    [data-hero-content] {
      position: relative;
      z-index: 1;
    }

    .asm-bounds {
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(52, 211, 153, 0.55);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.06) inset;
    }

    .asm-bounds::before,
    .asm-bounds::after {
      content: '';
      position: absolute;
      background: rgba(52, 211, 153, 0.7);
    }

    .asm-bounds::before {
      top: -1px;
      left: 12px;
      right: 12px;
      height: 1px;
    }

    .asm-bounds::after {
      left: -1px;
      top: 10px;
      bottom: 10px;
      width: 1px;
    }

    .asm-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(96, 165, 250, 0.85);
      border-style: solid;
      border-width: 0;
    }

    .asm-corner--tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .asm-corner--tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
    .asm-corner--bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
    .asm-corner--br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

    .asm-measure {
      position: absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: rgba(52, 211, 153, 0.9);
      line-height: 1;
      white-space: nowrap;
      background: rgba(6, 6, 8, 0.85);
      padding: 2px 5px;
      border-radius: 2px;
    }

    .asm-measure--top { top: -20px; left: 50%; }
    .asm-measure--right { right: -8px; top: 50%; }
    .asm-measure--bottom { bottom: -18px; left: 8px; }

    .asm-token-pill {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(6, 6, 8, 0.92);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .asm-token-pill::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.9);
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
    }

    .asm-token-pill--tl { top: -28px; right: -8px; }
    .asm-token-pill--tr { top: 6px; right: -108px; }
    .asm-token-pill--bl { bottom: -26px; left: -6px; }
    .asm-token-pill--br { bottom: 4px; right: -92px; }

    .hero-asm-chrome--tag .asm-bounds {
      border-radius: 12px;
    }

    .hero-asm-global-tokens {
      position: absolute;
      top: -48px;
      right: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 320px;
      pointer-events: none;
      z-index: 3;
    }

    .hero-asm-global-tokens .asm-token-pill {
      position: relative;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
    }

    .hero-asm-content-hidden {
      visibility: hidden;
    }

    .hero-greeting {
      font-size: clamp(14px, 1.8vw, 16px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    .hero-headline {
      font-size: clamp(36px, 5.8vw, 72px);
      font-weight: 500;
      line-height: 1.08;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0;
      max-width: 640px;
    }

    .hero-headline .line {
      display: block;
      overflow: hidden;
    }

    .hero-headline .line-inner {
      display: block;
    }

    .hero-headline .highlight {
      color: rgba(255, 255, 255, 1);
      background: linear-gradient(120deg, #fff 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      font-size: 13px;
      color: #060608;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
      box-shadow: 0 0 0 rgba(255,255,255,0);
    }

    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(255, 255, 255, 0.12);
    }

    .hero-cta::after { content: "→"; transition: transform 0.25s; }
    .hero-cta:hover::after { transform: translateX(4px); }

    .hero-scroll-hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-scroll-hint span {
      display: block;
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
      animation: scrollPulse 2s ease infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
      50% { opacity: 1; transform: scaleY(1); }
    }

    /* ── Hero Photo ── */
    .hero-photo-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      transform-style: preserve-3d;
      transform: rotateY(-4deg);
      will-change: transform;
    }

    .hero-photo-white-light {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 28px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 85% 50% at 50% 0%, rgba(255, 255, 255, 0.18) 0%, transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 38%);
    }

    .hero-photo-ring {
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      padding: 1px;
      background: linear-gradient(145deg, rgba(255,255,255,0.35), rgba(232,34,42,0.5), rgba(255,255,255,0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 2;
      pointer-events: none;
    }

    .hero-photo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--hero-photo-position, center center);
      border-radius: 28px;
      display: block;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .hero-photo-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 28px;
      background: linear-gradient(
        180deg,
        rgba(6, 6, 8, 0) 62%,
        rgba(6, 6, 8, 0.42) 100%
      );
      pointer-events: none;
    }

    .hero-photo-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
      animation: dotPulse 2s ease infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hero-float-tag {
      position: absolute;
      z-index: 4;
      padding: 10px 16px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(6, 6, 8, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(16px);
    }

    .hero-float-tag-1 {
      top: -12px;
      right: -16px;
    }

    .hero-float-tag-2 {
      bottom: 72px;
      right: -24px;
    }

    /* ── About Cards ── */
    .about-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 0;
      padding: 48px var(--page-padding) 0;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      scroll-margin-top: 100px;
    }

    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; }
    }

    .about-card {
      padding: 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.35s,
        background 0.35s;
      transition-delay: calc(var(--i, 0) * 0.08s);
    }

    #home.visible .about-card,
    #home.hero-content-ready .about-card {
      opacity: 1;
      transform: translateY(0);
    }

    .about-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
    }

    .about-card-icon {
      width: 20px;
      height: 20px;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .about-card-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .about-card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .about-card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .about-card-extra {
      margin-top: 24px;
    }

    .intro-hero-block {
      max-width: 1280px;
      margin: 0 auto;
      padding: 400px var(--page-padding) 0;
      scroll-margin-top: 100px;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #home.hero-content-ready .intro-hero-block {
      opacity: 1;
      transform: translateY(0);
    }

    .intro-hero-block .life-writings {
      padding: 0;
      margin: 0;
    }

    /* ── Education ── */
    .education-block {
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 48px) var(--page-padding) clamp(48px, 8vw, 64px);
      scroll-margin-top: 100px;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #home.hero-content-ready .education-block {
      opacity: 1;
      transform: translateY(0);
    }

    .education-heading {
      margin-bottom: clamp(24px, 4vw, 36px);
    }

    .education-icon {
      display: block;
      width: 32px;
      height: 32px;
      margin-bottom: 12px;
      object-fit: contain;
    }

    .education-act {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.96);
      margin-bottom: 0;
    }

    .education-label {
      display: block;
      margin-top: clamp(16px, 2.5vw, 22px);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }

    .education-list {
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3vw, 28px);
    }

    .education-item {
      display: grid;
      grid-template-columns: minmax(96px, 140px) minmax(0, 1fr) minmax(96px, 180px);
      gap: 12px clamp(24px, 4vw, 48px);
      align-items: baseline;
    }

    .education-period {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.42);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .education-school {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.95);
    }

    .education-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.42);
      text-align: right;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .education-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .education-meta {
        text-align: left;
      }
    }

    /* ── Act Two (Introduce) ── */
    .act-two-block {
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(72px, 11vw, 128px) var(--page-padding) clamp(80px, 12vw, 120px);
      scroll-margin-top: 100px;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #home.hero-content-ready .act-two-block {
      opacity: 1;
      transform: translateY(0);
    }

    .act-two-heading {
      margin-bottom: clamp(28px, 4vw, 40px);
    }

    .act-two-act {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.96);
      margin-bottom: 0;
    }

    .act-two-label {
      display: block;
      margin-top: clamp(16px, 2.5vw, 22px);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }

    .act-two-list {
      display: flex;
      flex-direction: column;
      gap: clamp(72px, 8vw, 100px);
    }

    .act-two-grid {
      display: grid;
      grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      gap: clamp(64px, 10vw, 160px);
      align-items: start;
    }

    .act-two-aside {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .act-two-logo {
      width: 60px;
      height: 60px;
      border-radius: 13px;
      object-fit: contain;

    /* ── Section Layout ── */

    }

    #work .life-writings {

    }

    .section-intro-title {
      font-size: clamp(20px, 3vw, 28px);

    }

    .section-title {

      letter-spacing: -0.02em;
      text-transform: uppercase;

    /* ── Timeline (Work) ── */
    .timeline-list {
      display: flex;
      flex-direction: column;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: minmax(160px, 240px) minmax(0, 1fr);
      gap: 12px 48px;
      padding: 36px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      align-items: start;
    }

    .timeline-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .timeline-company {
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }

    .timeline-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      max-width: none;
      line-height: 1.75;
    }

    .work-projects-block {
      margin-top: clamp(48px, 7vw, 72px);
      padding-top: 0;
    }

    #work:has(.life-writings) .work-projects-block {
      margin-top: clamp(32px, 5vw, 48px);
    }

    .work-projects-heading {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 48px;
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-projects-heading.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .work-projects {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: min(840px, 92%);
      margin: 0 auto;
    }

    .work-project-card {
      position: relative;
      display: block;
      width: 100%;
      min-height: 0;
      aspect-ratio: 16 / 10;
      border-radius: 24px;
      overflow: hidden;
      border: none;
      background: rgba(255, 255, 255, 0.03);
      opacity: 0;
      transform: translateY(32px);
      transition:
        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.3s;
      transition-delay: calc(var(--i, 0) * 0.08s);
      isolation: isolate;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .work-project-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .work-project-card.visible:hover {
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
      transform: translateY(-3px);
    }

    .work-project-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-project-card:hover img {
      transform: scale(1.03);
    }

    .work-project-card[data-fit="contain"] {
      aspect-ratio: var(--project-aspect, 16 / 9);
      background: transparent;
      overflow: visible;
      border: none;
    }

    .work-project-card[data-fit="contain"] img {
      object-fit: contain;
      object-position: center center;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .work-project-card[data-fit="contain"]:hover img {
      transform: none;
    }

    .work-project-card[data-fit="contain"].visible:hover {
      transform: translateY(-3px);
    }

    .work-project-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 6, 8, 0) 55%, rgba(6, 6, 8, 0.72) 100%);
      pointer-events: none;
    }

    .work-project-card[data-no-title] .work-project-overlay {
      background: transparent;
    }

    .work-project-title-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 28px 32px;
      pointer-events: none;
    }

    .work-project-title {
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.98);
      line-height: 1.25;
    }

    .work-project-card[data-align="center"] .work-project-title-wrap {
      text-align: center;
    }

    @media (max-width: 768px) {
      .timeline-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .work-project-card:not([data-fit="contain"]) {
        border-radius: 20px;
        aspect-ratio: 4 / 3;
      }

      .work-project-card[data-fit="contain"] {
        border-radius: 24px;
      }

      .work-project-card[data-fit="contain"] img {
        border-radius: 24px;
      }

      .work-project-title-wrap {
        padding: 20px 24px;
      }
    }

    /* ── Work Project Modal ── */
    .work-modal {
      position: fixed;
      inset: 0;
      z-index: 210;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(6, 6, 8, 0.88);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, visibility 0.35s;
    }

    .work-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .work-modal-inner {
      position: relative;
      width: min(100%, 420px);
      padding: 40px 32px 36px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(120% 100% at 50% 0%, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 42%, rgba(6, 6, 8, 0.96) 100%);
      text-align: center;
      transform: scale(0.94) translateY(8px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-modal.open .work-modal-inner {
      transform: scale(1) translateY(0);
    }

    .work-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.7);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;

    .work-modal-close:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);

}
</script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script>
    let data;
    let heroIntroPlayed = false;

    function applyTokens(tokens, meta) {
      const root = document.documentElement;
      const c = tokens.colors;
      root.style.setProperty('--bg', c.background);
      root.style.setProperty('--surface', c.surface);
      root.style.setProperty('--surface-hover', c.surfaceHover);
      root.style.setProperty('--border', c.border);
      root.style.setProperty('--text-primary', c.textPrimary);
      root.style.setProperty('--text-secondary', c.textSecondary);
      root.style.setProperty('--text-muted', c.textMuted);
      if (meta?.title) document.title = meta.title;
    }

    async function loadData() {
      const inline = document.getElementById('portfolio-data');
      if (inline?.textContent.trim()) {
        return JSON.parse(inline.textContent);
      }
      const res = await fetch('./portfolio-content.json');
      if (!res.ok) throw new Error('无法加载 portfolio-content.json');
      return res.json();
    }

    function renderAll() {
      applyTokens(data.designTokens, data.meta);
      renderNav(data.navigation);
      renderHero(data.hero);
      renderAboutCards(data.aboutCards);
      renderIntroHero(data.introHero);
      renderEducation(data.education);
      renderActTwo(data.actTwo);
      renderSections(data.sections);
      renderFooter(data.footer);
      setupInteractions(data);
      setupWorkProjectModal();
      document.getElementById('home')?.classList.add('visible');
    }

    function setupWorkProjectModal() {
      const modal = document.getElementById('work-modal');
      const closeBtn = document.getElementById('work-modal-close');
      const subtitle = document.getElementById('work-modal-subtitle');

      function openModal(title) {
        subtitle.textContent = title || '';
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.work-project-card').forEach(card => {
        card.addEventListener('click', () => {
          const href = card.dataset.projectHref;
          if (href) {
            window.location.href = href;
            return;
          }
          openModal(card.dataset.projectTitle || '');
        });
      });

      closeBtn?.addEventListener('click', closeModal);
      modal?.addEventListener('click', e => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal?.classList.contains('open')) closeModal();
      });
    }

    async function init() {
      try {
        data = await loadData();
        renderAll();
      } catch (err) {
        console.error(err);
        document.body.insertAdjacentHTML('beforeend',
          '<p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;padding:24px;text-align:center;">页面数据加载失败，请刷新重试。</p>'
        );
      }
    }

    /* ── Icon SVGs ── */
    const icons = {
      user: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
      code: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      spark: '<svg class="about-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>'
    };

    function renderNav(items) {
      const nav = document.getElementById('nav');
      nav.innerHTML = items.map(item => `
        <a class="nav-item${item.active ? ' active' : ''}" href="${item.href}" data-shortcut="${item.shortcut}">
          ${item.label}
          <span class="nav-badge">${item.shortcut}</span>
        </a>
      `).join('');
    }

    function renderHero(hero) {
      document.getElementById('hero-greeting').textContent = hero.greeting;

      const muted = hero.headline.muted;
      const highlight = hero.headline.highlight;
      const parts = muted.split(' and ');
      const lines = parts.length >= 2
        ? [parts[0] + ' and', parts.slice(1).join(' and ')]
        : [muted.replace(/\s+at\s*$/, '')];

      document.getElementById('hero-headline').innerHTML = [
        ...lines.map(l => `<span class="line"><span class="line-inner">${l}</span></span>`),
        `<span class="line"><span class="line-inner"><span class="highlight">${highlight}</span></span></span>`
      ].join('');

      const cta = document.getElementById('hero-cta');
      cta.textContent = hero.cta.label;
      cta.href = hero.cta.href;

      const photo = document.getElementById('hero-photo');
      if (hero.image && photo) {
        photo.src = hero.image;
        photo.alt = hero.imageAlt || hero.greeting.replace("Hello! I'm ", '');
        if (hero.imageObjectPosition) {
          photo.style.setProperty('--hero-photo-position', hero.imageObjectPosition);
        }
      }
      const badgeText = document.getElementById('hero-badge-text');
      if (badgeText && hero.badge) badgeText.textContent = hero.badge;

      setupHeroAssemblyAnimation(() => setupHeroParallax());
    }

    /** 根据真实内容尺寸，像素级对齐规范线框与标注文案 */
    function alignHeroSpecChrome(scope) {
      const PAD = { x: 16, y: 14 };

      const fitChrome = (content, chrome, pad = PAD) => {
        if (!content || !chrome) return;
        chrome.style.top = `${-pad.y}px`;
        chrome.style.right = `${-pad.x}px`;
        chrome.style.bottom = `${-pad.y}px`;
        chrome.style.left = `${-pad.x}px`;
      };

      scope.querySelectorAll('.hero-asm-wrap').forEach(wrap => {
        const content = wrap.querySelector('[data-hero-content]');
        const chrome = wrap.querySelector('[data-asm-chrome]');
        if (!content || !chrome) return;

        fitChrome(content, chrome);
        const rect = content.getBoundingClientRect();
        const cs = getComputedStyle(content);

        const topM = chrome.querySelector('.asm-measure--top');
        if (topM) {
          const isHeadline = wrap.classList.contains('hero-asm-wrap--headline');
          topM.textContent = isHeadline
            ? `max-w: ${Math.round(parseFloat(cs.maxWidth) || rect.width)}px`
            : `h: ${Math.round(rect.height)}px`;
        }

        const rightM = chrome.querySelector('.asm-measure--right');
        if (rightM) {
          const fontSize = Math.round(parseFloat(cs.fontSize) || rect.height);
          rightM.textContent = `${fontSize}px`;
        }

        const bottomM = chrome.querySelector('.asm-measure--bottom');
        if (bottomM) bottomM.textContent = `w: ${Math.round(rect.width)}px`;
      });

      scope.querySelectorAll('[data-asm-tag]').forEach(tag => {
        const content = tag.querySelector('[data-hero-content]');
        const chrome = tag.querySelector('[data-asm-chrome]');
        fitChrome(content, chrome, { x: 10, y: 8 });
        const rect = tag.getBoundingClientRect();
        const bottomM = chrome?.querySelector('.asm-measure--bottom');
        if (bottomM) bottomM.textContent = `w: ${Math.round(rect.width)}px`;
      });

      const photoWrap = scope.querySelector('.hero-asm-wrap--photo');
      const photo = scope.querySelector('#hero-photo-frame');
      const photoChrome = scope.querySelector('[data-asm-photo]');
      if (photo && photoChrome) {
        fitChrome(photo, photoChrome, { x: 24, y: 20 });
        const w = Math.round(photo.offsetWidth);
        const h = Math.round(photo.offsetHeight);
        const topM = photoChrome.querySelector('.asm-measure--top');
        if (topM) topM.textContent = `${w} × ${h}`;
        const rightM = photoChrome.querySelector('.asm-measure--right');
        if (rightM) rightM.textContent = `${h}px`;
        const bottomM = photoChrome.querySelector('.asm-measure--bottom');
        if (bottomM) bottomM.textContent = `3:4`;
        const wToken = photoChrome.querySelector('.asm-token-pill--tr');
        if (wToken) wToken.textContent = `w: ${w}px`;
      }

      const copy = scope.querySelector('#hero-copy');
      const grid = scope.querySelector('#hero-asm-grid');
      if (copy && grid) {
        grid.style.top = `${-20}px`;
        grid.style.left = `${-24}px`;
        grid.style.right = `${-28}px`;
        grid.style.bottom = `${-16}px`;
      }

    }

    function setupHeroAssemblyAnimation(onComplete) {
      const navWrapper = document.querySelector('.nav-wrapper');
      const scope = document.getElementById('home');

      const finishIntro = () => {
        navWrapper?.classList.add('is-visible');
        scope?.classList.add('hero-content-ready');
        onComplete?.();
      };

      if (heroIntroPlayed || typeof gsap === 'undefined') {
        finishIntro();
        return;
      }

      if (!scope) {
        finishIntro();
        return;
      }

      scope._heroIntroCtx?.revert();

      const runTimeline = () => {
        alignHeroSpecChrome(scope);

        const grid = scope.querySelector('#hero-asm-grid');
        const globalTokens = scope.querySelector('#hero-asm-global-tokens');
        const bounds = scope.querySelectorAll('.asm-bounds');
        const corners = scope.querySelectorAll('.asm-corner');
        const measuresH = scope.querySelectorAll('.asm-measure--top, .asm-measure--bottom, [data-asm-dim-h]');
        const measuresV = scope.querySelectorAll('.asm-measure--right, [data-asm-dim-v]');
        const tokenPills = scope.querySelectorAll('.asm-token-pill');
        const chromeFadeTargets = [grid, ...corners, ...measuresH, ...measuresV, ...tokenPills];
        if (globalTokens) chromeFadeTargets.push(globalTokens);
        const contentBlocks = [...scope.querySelectorAll('[data-hero-content]')];
        const aboutGrid = document.getElementById('about');
        const educationBlock = document.getElementById('education');
        const actTwoBlock = document.getElementById('act-two');

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const ease = 'power4.out';

        scope._heroIntroCtx = gsap.context(() => {
          if (reduceMotion) {
            gsap.set([...chromeFadeTargets, ...bounds], { opacity: 0, autoAlpha: 0 });
            gsap.set(contentBlocks, { autoAlpha: 1, scale: 1, y: 0 });
            navWrapper?.classList.add('is-visible');
            scope.classList.add('hero-content-ready');
            heroIntroPlayed = true;
            onComplete?.();
            return;
          }

          gsap.set(contentBlocks, { autoAlpha: 0, scale: 0.98, y: 6 });
          gsap.set(aboutGrid, { autoAlpha: 0, y: 16 });
          if (educationBlock) gsap.set(educationBlock, { autoAlpha: 0, y: 20 });
          if (actTwoBlock) gsap.set(actTwoBlock, { autoAlpha: 0, y: 20 });
          gsap.set(navWrapper, { autoAlpha: 0, y: -10 });
          navWrapper?.classList.remove('is-visible');
          scope.classList.remove('hero-content-ready');
          gsap.set(grid, { opacity: 0 });
          gsap.set(bounds, { opacity: 0, scaleX: 0, scaleY: 0, transformOrigin: '50% 50%' });
          gsap.set(corners, { opacity: 0, scale: 0.7, transformOrigin: '50% 50%' });
          gsap.set(measuresH, { opacity: 0, scaleX: 0, transformOrigin: '50% 50%' });
          gsap.set(measuresV, { opacity: 0, scaleY: 0, transformOrigin: '0% 50%' });
          gsap.set(tokenPills, { opacity: 0, y: 8 });
          if (globalTokens) gsap.set(globalTokens, { opacity: 0, y: 8 });

          scope.querySelectorAll('.asm-measure--top').forEach(el => {
            gsap.set(el, { xPercent: -50, transformOrigin: '50% 50%' });
          });
          scope.querySelectorAll('.asm-measure--bottom').forEach(el => {
            gsap.set(el, { transformOrigin: '0% 50%' });
          });
          scope.querySelectorAll('.asm-measure--right').forEach(el => {
            gsap.set(el, { xPercent: 100, yPercent: -50, transformOrigin: '0% 50%' });
          });
          scope.querySelectorAll('[data-asm-dim-h]').forEach(el => {
            gsap.set(el, { opacity: 0, scaleX: 0, transformOrigin: '50% 50%' });
          });
          scope.querySelectorAll('[data-asm-dim-v]').forEach(el => {
            gsap.set(el, { opacity: 0, scaleY: 0, transformOrigin: '50% 50%' });
          });

          const tl = gsap.timeline({
            onComplete: () => {
              heroIntroPlayed = true;
              gsap.set([...chromeFadeTargets, ...bounds], { visibility: 'hidden' });
              navWrapper?.classList.add('is-visible');
              scope.classList.add('hero-content-ready');
              onComplete?.();
            },
          });

          // ── 阶段一：线框精准绘制（1s）──
          tl.to(grid, { opacity: 0.28, duration: 0.32, ease }, 0)
            .to(bounds, {
              scaleX: 1,
              opacity: 1,
              duration: 0.42,
              ease,
              stagger: 0.04,
            }, 0.06)
            .to(scope.querySelectorAll('[data-asm-dim-h]'), {
              scaleX: 1,
              opacity: 1,
              duration: 0.36,
              ease,
              stagger: 0.05,
            }, 0.2)
            .to(bounds, {
              scaleY: 1,
              duration: 0.38,
              ease,
              stagger: 0.035,
            }, 0.24)
            .to(scope.querySelectorAll('[data-asm-dim-v]'), {
              scaleY: 1,
              opacity: 1,
              duration: 0.34,
              ease,
              stagger: 0.05,
            }, 0.3)
            .to(corners, {
              scale: 1,
              opacity: 1,
              duration: 0.3,
              ease,
              stagger: 0.025,
            }, 0.38)
            .to(measuresH, {
              scaleX: 1,
              opacity: 1,
              duration: 0.28,
              ease,
              stagger: 0.03,
            }, 0.48)
            .to(measuresV, {
              scaleY: 1,
              opacity: 1,
              duration: 0.26,
              ease,
              stagger: 0.03,
            }, 0.54)
            .to(tokenPills, {
              opacity: 1,
              y: 0,
              duration: 0.3,
              ease,
              stagger: 0.04,
            }, 0.62);

          if (globalTokens) {
            tl.to(globalTokens, { opacity: 1, y: 0, duration: 0.3, ease }, 0.66);
          }

          tl.addLabel('wireframe', 1)
            .to({}, { duration: 0.6 })
            .addLabel('fadeOut');

          // ── 阶段二：线框完全消失 ──
          const fadeDur = 0.52;

          tl.to(chromeFadeTargets, {
            opacity: 0,
            duration: fadeDur,
            ease,
            stagger: 0.012,
          }, 'fadeOut')
            .to(bounds, {
              scaleX: 0.96,
              scaleY: 0.96,
              opacity: 0,
              duration: fadeDur,
              ease,
              stagger: 0.01,
              transformOrigin: '50% 50%',
            }, 'fadeOut')
            .addLabel('contentIn', `fadeOut+=${fadeDur + 0.08}`);

          // ── 阶段三：线框消失后再显现真实内容 ──
          const contentDur = 0.72;

          tl.to(contentBlocks, {
            autoAlpha: 1,
            scale: 1,
            y: 0,
            duration: contentDur,
            ease,
            stagger: 0.035,
          }, 'contentIn')
            .to(aboutGrid, {
              autoAlpha: 1,
              y: 0,
              duration: contentDur * 0.85,
              ease,
            }, 'contentIn+=0.12');
          if (educationBlock) {
            tl.to(educationBlock, {
              autoAlpha: 1,
              y: 0,
              duration: contentDur * 0.85,
              ease,
            }, 'contentIn+=0.22');
          }
          if (actTwoBlock) {
            tl.to(actTwoBlock, {
              autoAlpha: 1,
              y: 0,
              duration: contentDur * 0.85,
              ease,
            }, 'contentIn+=0.32');
          }
          tl.to(navWrapper, {
              autoAlpha: 1,
              y: 0,
              duration: 0.55,
              ease,
              onComplete: () => navWrapper?.classList.add('is-visible'),
            }, 'contentIn+=0.28')
            .add(() => scope.classList.add('hero-content-ready'), 'contentIn+=0.15');

        }, scope);
      };

      const photo = scope.querySelector('#hero-photo');
      let started = false;
      const kickoff = () => {
        if (started) return;
        started = true;
        requestAnimationFrame(() => requestAnimationFrame(runTimeline));
      };

      alignHeroSpecChrome(scope);
      if (photo?.src && !photo.complete) {
        photo.addEventListener('load', kickoff, { once: true });
        photo.addEventListener('error', kickoff, { once: true });
      } else {
        kickoff();
      }
    }

    function setupHeroParallax() {
      const frame = document.getElementById('hero-photo-frame');
      if (!frame || window.matchMedia('(pointer: coarse)').matches) return;

      let raf = null;
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      document.addEventListener('mousemove', e => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        targetX = (e.clientX - cx) / cx * 8;
        targetY = (e.clientY - cy) / cy * 6;
        if (!raf) raf = requestAnimationFrame(tick);
      });

      function tick() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        frame.style.transform = `perspective(1200px) rotateY(${-4 + currentX * 0.4}deg) rotateX(${currentY * -0.3}deg) translateY(0)`;
        raf = Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01
          ? requestAnimationFrame(tick) : null;
      }
    }

    function renderActTwo(actTwo) {
      const el = document.getElementById('act-two');
      if (!el || !actTwo) {
        if (el) el.innerHTML = '';
        return;
      }

      const experiences = actTwo.experiences?.length
        ? actTwo.experiences
        : (actTwo.headline || actTwo.paragraphs ? [actTwo] : []);

      if (!experiences.length) {
        el.innerHTML = '';
        return;
      }

      const experienceHtml = experiences.map(exp => {
        const paragraphs = (exp.paragraphs || [])
          .map(text => `<p>${text}</p>`)
          .join('');
        return `
          <div class="act-two-grid">
            <aside class="act-two-aside">
              ${exp.logo ? `<img class="act-two-logo" src="${exp.logo}"${exp.logoSrcset ? ` srcset="${exp.logoSrcset}"` : ''} width="60" height="60" alt="${exp.logoAlt || ''}" />` : ''}
              <div class="act-two-aside-copy">
                ${exp.headline ? `<h3 class="act-two-headline">${exp.headline}</h3>` : ''}
                ${exp.period ? `<p class="act-two-period">${exp.period}</p>` : ''}
              </div>
            </aside>
            <div class="act-two-body">${paragraphs}</div>
          </div>
        `;
      }).join('');

      el.innerHTML = `
        <div class="act-two-heading">
          ${(actTwo.actTitle || actTwo.title) ? `<h2 class="act-two-act">${actTwo.actTitle || ''}${actTwo.title ? `<br>${actTwo.title}` : ''}</h2>` : ''}
          ${actTwo.label ? `<span class="act-two-label">${actTwo.label}</span>` : ''}
        </div>
        <div class="act-two-list">${experienceHtml}</div>
      `;
    }

    function renderIntroHero(introHero) {
      const el = document.getElementById('intro-hero');
      if (!el) return;
      el.innerHTML = introHero ? renderSectionHero(introHero) : '';
    }

    function renderEducation(education) {
      const el = document.getElementById('education');
      if (!el || !education?.items?.length) {
        if (el) el.innerHTML = '';
        return;
      }

      el.innerHTML = `
        <div class="education-heading">
          ${education.icon ? `<img class="education-icon" src="${education.icon}" width="32" height="32" alt="" aria-hidden="true" />` : ''}
          <h2 class="education-act">${education.actTitle || ''}<br>${education.title || ''}</h2>
          ${education.label ? `<span class="education-label">${education.label}</span>` : ''}
        </div>
        <div class="education-list">
          ${education.items.map(item => `
            <div class="education-item">
              <span class="education-period">${item.period || ''}</span>
              <span class="education-school">${item.school || ''}</span>
              <span class="education-meta">${item.meta || ''}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderAboutCards(cards) {
      document.getElementById('about').innerHTML = cards.map((card, i) => `
        <article class="about-card" id="about-${card.id}" style="--i:${i}">
          ${icons[card.icon] || ''}
          <h3 class="about-card-title">${card.title}</h3>
          <p class="about-card-subtitle">${card.subtitle}</p>
          <p class="about-card-desc">${card.description}</p>
          ${card.extra ? `
            <div class="about-card-extra">
              <p class="about-card-subtitle">${card.extra.subtitle}</p>
              <p class="about-card-desc">${card.extra.description}</p>
            </div>
          ` : ''}
        </article>
      `).join('');
    }

    function renderWorkProjects(projects) {
      if (!projects?.length) return '';
      return `
        <div class="work-projects-block">
          <div class="work-projects">
          ${projects.map((item, i) => {
            const align = item.titleAlign === 'center' ? ' data-align="center"' : '';
            const noTitle = item.showTitle === false ? ' data-no-title="true"' : '';
            const fit = item.imageFit === 'contain' ? ' data-fit="contain"' : '';
            const aspectStyle = item.aspectRatio
              ? `--i:${i}; --project-aspect: ${item.aspectRatio}`
              : `--i:${i}`;
            const srcset = item.imageSrcset
              ? ` srcset="${item.imageSrcset}" sizes="(max-width: 840px) 92vw, 840px"`
              : '';
            const dims = item.imageWidth && item.imageHeight
              ? ` width="${item.imageWidth}" height="${item.imageHeight}"`
              : '';
            const hrefAttr = item.href ? ` data-project-href="${item.href}"` : '';
            return `
              <button type="button" class="work-project-card"${align}${noTitle}${fit}${hrefAttr} style="${aspectStyle}" data-project-title="${item.title}">
                <img src="${item.image}"${srcset}${dims} alt="${item.title}" loading="lazy" decoding="async" />
                <div class="work-project-overlay"></div>
                ${item.showTitle !== false ? `
                <div class="work-project-title-wrap">
                  <h3 class="work-project-title">${item.title}</h3>
                </div>
                ` : ''}
              </button>
            `;
          }).join('')}
          </div>
        </div>
      `;
    }

    function renderSectionHero(hero, anchorId) {
      if (!hero) return '';
      const articles = hero.articles?.map((item, i) => `
        <a class="life-writings-article" href="${item.href || '#'}"${item.href?.startsWith('http') ? ' target="_blank" rel="noopener"' : ''} style="--i:${i}">
          <div class="life-writings-article-meta">
            <strong>${item.title}</strong>
            ${item.date ? `<span class="life-writings-article-date">${item.date}</span>` : ''}
          </div>
          ${item.subtitle ? `<h4 class="life-writings-article-subtitle">${item.subtitle}</h4>` : ''}
          ${item.excerpt ? `<p class="life-writings-article-excerpt">${item.excerpt}</p>` : ''}
        </a>
      `).join('') || '';

      const idAttr = anchorId ? ` id="${anchorId}"` : '';
      const lifeBodyLead = hero.life?.bodyLead
        ? `<p>${hero.life.bodyLead}</p>`
        : '';
      const lifeParagraphs = hero.life?.paragraphs?.length
        ? hero.life.paragraphs.map(p => `<p>${p}</p>`).join('')
        : hero.life?.description
          ? `<p>${hero.life.description}</p>`
          : '';
      const lifeMedia = hero.life?.image ? `
        <figure class="life-writings-life-media">
          <img src="${hero.life.image}" alt="${hero.life.imageAlt || ''}" loading="lazy" decoding="async" />
          ${hero.life.imageCaption ? `<figcaption class="life-writings-life-media-caption">${hero.life.imageCaption}</figcaption>` : ''}
        </figure>
      ` : '';
      const lifeAfterImage = hero.life?.afterImageParagraphs?.length
        ? `<div class="life-writings-life-after">${hero.life.afterImageParagraphs.map(p => `<p>${p}</p>`).join('')}</div>`
        : '';
      const lifeBlock = hero.life ? `
        <div class="life-writings-life">
          ${hero.life.title ? `<h3 class="life-writings-life-title">${hero.life.title}</h3>` : ''}
          ${hero.life.introTitle ? `<p class="life-writings-life-intro">${hero.life.introTitle}</p>` : ''}
          ${hero.life.bodyLabel ? `<span class="life-writings-life-body-label">${hero.life.bodyLabel}</span>` : ''}
          ${lifeParagraphs || lifeBodyLead ? `<div class="life-writings-life-body">${lifeBodyLead}${lifeParagraphs}</div>` : ''}
          ${lifeMedia}
          ${lifeAfterImage}
        </div>
      ` : '';

      return `
        <div class="life-writings"${idAttr}>
          <svg class="life-writings-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 2l2.2 6.8H25l-5.6 4.1 2.2 6.8L16 16.4l-5.6 3.5 2.2-6.8L7 8.8h6.8L16 2z" fill="currentColor"/>
          </svg>
          <h2 class="life-writings-title">
            ${hero.title || ''}${hero.index ? `<sup class="life-writings-index">${hero.index}</sup>` : ''}
          </h2>
          ${hero.description ? `<p class="life-writings-desc">${hero.description}</p>` : ''}
          ${lifeBlock}
          ${articles ? `<div class="life-writings-articles">${articles}</div>` : ''}
        </div>
      `;
    }

    function renderLifeWritings(writings) {
      return renderSectionHero(writings, 'future');
    }

    function renderSections(sections) {
      const container = document.getElementById('sections-container');
      container.innerHTML = sections.map(section => {
        let body = '';
        if (section.type === 'timeline' || section.type === 'work') {
          if (section.items?.length) {
            body = `
            <div class="timeline-list">
              ${section.items.map(item => `
                <div class="timeline-item">
                  <h4 class="timeline-company">${item.title.replace(/^\*/, '')}</h4>
                  <p class="timeline-desc">${item.description}</p>
                </div>
              `).join('')}
            </div>
          `;
          }
          if (section.projects?.length) {
            body += renderWorkProjects(section.projects);
          }
        } else if (section.type === 'card-grid') {
          body = `
            ${section.description ? `<p class="section-desc">${section.description}</p>` : ''}
            <div class="card-grid">
              ${section.items.map((item, i) => `
                <a class="play-card" href="${item.href}" target="_blank" rel="noopener" style="--i:${i}">
                  <h4 class="play-card-title">${item.title}</h4>
                  <p class="play-card-desc">${item.description}</p>
                  <div class="play-card-tags">
                    ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                  </div>
                </a>
              `).join('')}
            </div>
            ${section.footnotes ? `
              <div class="footnotes">
                ${section.footnotes.map(f => `<p class="footnote">${f}</p>`).join('')}
              </div>
            ` : ''}
          `;
        } else if (section.type === 'article-list') {
          body = `
            ${section.description ? `<p class="section-desc">${section.description}</p>` : ''}
            <div class="article-list">
              ${section.items.map((item, i) => `
                <a class="article-item" href="${item.href}" target="_blank" rel="noopener" style="--i:${i}">
                  <div class="article-meta">
                    <h4 class="article-title">${item.title}</h4>
                    <span class="article-date">${item.date}</span>
                  </div>
                  <p class="article-subtitle">${item.subtitle}</p>
                  <p class="article-excerpt">${item.excerpt}</p>
                </a>
              `).join('')}
            </div>
          `;
        }
        const hero = section.hero || section.writings;
        const useHeroHeader = !!hero;
        const hideLifeTitles = section.id === 'life' && !!hero?.life;
        const heroHtml = hero
          ? renderSectionHero(hero, section.id === 'life' ? 'future' : '')
          : '';
        const showSectionTitle = !(useHeroHeader && section.id === 'work') && !hideLifeTitles;
        const showIntroTitle = section.introTitle && !hideLifeTitles;

        return `
          <section id="${section.id}" class="content-section">
            <div class="section-grid">
              ${useHeroHeader ? '' : `<span class="section-index">${section.index}</span>`}
              <div class="section-main">
                ${heroHtml}
                ${showSectionTitle ? `<h2 class="section-title">${section.title}</h2>` : ''}
                ${showIntroTitle ? `<h3 class="section-intro-title">${section.introTitle}</h3>` : ''}
                ${body}
              </div>
            </div>
          </section>
        `;
      }).join('');
    }

    function renderFooter(footer) {
      document.getElementById('footer').innerHTML = `
        <div class="footer-inner">
          <div class="footer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 12.5l2.5 2.5L16 9.5"/>
            </svg>
          </div>
          <blockquote class="footer-quote">"${footer.quote}"</blockquote>
          <div class="footer-meta">
            <p>${footer.builtWith}</p>
            <p>${footer.designedBy}</p>
            <p>${footer.copyright}</p>
          </div>
        </div>
      `;
    }

    /* ── Interactions ── */
    function setupInteractions(data) {
      // Scroll reveal
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: data.interactions.sectionReveal.threshold });

      document.querySelectorAll('section').forEach(s => observer.observe(s));

      const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

      document.querySelectorAll('.work-project-card, .section-intro-title').forEach(el => {
        revealObserver.observe(el);
      });

      // Active nav on scroll
      const sectionIds = ['home', ...data.sections.map(s => s.id)];
      const navItems = document.querySelectorAll('.nav-item');

      function updateActiveNav() {
        let current = 'home';
        sectionIds.forEach(id => {
          const el = document.getElementById(id);
          if (el && el.getBoundingClientRect().top <= 200) current = id;
        });
        navItems.forEach(item => {
          const href = item.getAttribute('href').slice(1);
          const activeId = href === 'future' ? 'life' : href;
          item.classList.toggle('active', activeId === current);
        });
      }

      window.addEventListener('scroll', updateActiveNav, { passive: true });

      // Keyboard shortcuts
      if (data.interactions.keyboardShortcuts.enabled) {
        const hint = document.getElementById('keyboard-hint');
        let hintTimer;

        document.addEventListener('keydown', e => {
          const mapping = data.interactions.keyboardShortcuts.mapping;
          if (mapping[e.key]) {
            e.preventDefault();
            const target = document.querySelector(mapping[e.key]);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
            hint.classList.add('show');
            clearTimeout(hintTimer);
            hintTimer = setTimeout(() => hint.classList.remove('show'), 1500);
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
